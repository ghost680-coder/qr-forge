        .btn-generate {

        .qr-box {

            transition: all 0.3s;
        }
        .qr-box.visible {
            display: inline-block;
            animation: qrPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes qrPop {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }

        .qr-box #qrcode {
            display: inline-block;
        }
        .qr-box #qrcode canvas {
            display: block;

        .qr-actions button {
            background: rgba(255, 255, 255, 0.04);

            color: rgba(255, 255, 255, 0.5);
            padding: clamp(0.35rem, 0.5vw, 0.6rem) clamp(1rem, 1.5vw, 1.8rem);

            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: clamp(36px, 4vh, 44px);

        .qr-actions .btn-primary {

        .footer {

        }

        .toast {
            position: fixed;
            bottom: clamp(1.2rem, 3vh, 2.5rem);
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(16, 20, 32, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: clamp(0.5rem, 0.7vw, 0.8rem) clamp(1rem, 2vw, 2.5rem);
            border-radius: 60px;
            color: #d4dcec;
            font-size: clamp(0.7rem, 0.85vw, 0.9rem);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            pointer-events: none;
            white-space: nowrap;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast i {

            color: #34d399;

        @media (max-width: 480px) {

        @media (prefers-reduced-motion: reduce) {

<body>
    <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">
        Free QR Code Generator – Convert URL, WiFi, vCard, Social, Events & More to QR
    </h1>

    <div class="card">
        <div class="header">
            <div class="icon-wrap"><i class="fas fa-qrcode"></i></div>
            <div class="title-group">
                <h1>QR Forge</h1>
                <div class="sub">Instant QR codes · 23+ data types · No uploads</div>
            </div>
        </div>

        <div class="grid">
            <div>
                <div class="input-group">
                    <label for="dataType">Data Type</label>
                    <div class="custom-select">
                        <select id="dataType">
                            <option value="url">🔗 URL / Website</option>
                            <option value="text">📝 Plain Text</option>
                            <option value="email">✉️ Email</option>
                            <option value="phone">📞 Phone</option>
                            <option value="sms">💬 SMS</option>
                            <option value="wifi">📶 WiFi</option>
                            <option value="vcard">👤 vCard</option>
                            <option value="event">📅 Event</option>
                            <option value="instagram">📸 Instagram</option>
                            <option value="twitter">🐦 Twitter/X</option>
                            <option value="facebook">📘 Facebook</option>
                            <option value="linkedin">💼 LinkedIn</option>
                            <option value="tiktok">🎵 TikTok</option>
                            <option value="youtube">▶️ YouTube</option>
                            <option value="whatsapp">💬 WhatsApp</option>
                            <option value="multiurl">🔗 Multi URL</option>
                            <option value="appstore">📱 App Store</option>
                            <option value="googleplay">📱 Google Play</option>
                            <option value="pdf">📄 PDF</option>
                            <option value="menu">🍽️ Menu</option>
                            <option value="review">⭐ Review</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="dataInput" id="inputLabel">Enter URL</label>
                    <textarea id="dataInput" placeholder="https://example.com"></textarea>
                </div>

                <!-- File upload row – visible only for PDF & Menu -->
                <div class="file-upload-row" id="fileUploadRow">
                    <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png,.webp" />
                    <button class="upload-btn" id="uploadBtn"><i class="fas fa-upload"></i> <span id="uploadBtnText">Upload Image</span></button>
                    <span class="file-info" id="fileInfo">
                        <img class="preview-thumb" id="filePreview" src="" alt="preview" />
                        <span id="fileName"></span> (<span id="fileSize"></span>)
                    </span>
                    <span class="compress-info" id="compressInfo">📦 Compressed</span>
                    <button class="clear-file" id="clearFileBtn">✕</button>
                    <span class="size-warning" id="sizeWarning">⚠️ Too large</span>
                </div>

                <button class="btn-generate" id="generateBtn">
                    <i class="fas fa-bolt"></i> Generate QR Code
                </button>
            </div>

            <div class="qr-panel" id="qrPanel">
                <div class="placeholder" id="placeholder">
                    <i class="fas fa-qrcode"></i>
                    <p>Your QR will appear here</p>
                </div>

                <div class="qr-box" id="qrBox">
                    <div id="qrcode"></div>
                </div>

                <div class="qr-actions" id="qrActions">
                    <button class="btn-primary" id="downloadBtn"><i class="fas fa-download"></i> Download PNG</button>
                    <button id="resetBtn"><i class="fas fa-redo-alt"></i> New</button>
                </div>
            </div>
        </div>

        <div class="footer">🔒 All processing is local · <span>No uploads, no tracking</span></div>
    </div>

    <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg">Done!</span></div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script>
        (function() {
            // ─── DOM refs ───
            const dataType = document.getElementById('dataType');
            const dataInput = document.getElementById('dataInput');
            const inputLabel = document.getElementById('inputLabel');
            const generateBtn = document.getElementById('generateBtn');
            const qrContainer = document.getElementById('qrcode');
            const placeholder = document.getElementById('placeholder');
            const qrBox = document.getElementById('qrBox');
            const qrPanel = document.getElementById('qrPanel');
            const qrActions = document.getElementById('qrActions');
            const downloadBtn = document.getElementById('downloadBtn');
            const resetBtn = document.getElementById('resetBtn');
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');

            // File upload elements
            const fileUploadRow = document.getElementById('fileUploadRow');
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const uploadBtnText = document.getElementById('uploadBtnText');
            const fileInfo = document.getElementById('fileInfo');
            const filePreview = document.getElementById('filePreview');
            const fileName = document.getElementById('fileName');
            const fileSize = document.getElementById('fileSize');
            const clearFileBtn = document.getElementById('clearFileBtn');
            const sizeWarning = document.getElementById('sizeWarning');
            const compressInfo = document.getElementById('compressInfo');

            let toastTimer = null;
            let uploadedFileBase64 = null;

            function showToast(msg, icon = 'fa-check-circle', color = '#34d399') {
                toastMsg.textContent = msg;
                toast.querySelector('i').className = 'fas ' + icon;
                toast.querySelector('i').style.color = color;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
            }

            // ─── Type configs ───
            const typeConfigs = {
                url:       { label: 'Enter URL', placeholder: 'https://example.com' },
                text:      { label: 'Enter Text', placeholder: 'Type anything...' },
                email:     { label: 'Enter Email', placeholder: 'someone@example.com' },
                phone:     { label: 'Enter Phone', placeholder: '+91 9876543210' },
                sms:       { label: 'Enter SMS', placeholder: 'Hello, this is a test' },
                wifi:      { label: 'WiFi Network', placeholder: 'SSID:MyWiFi,Password:secret,Type:WPA' },
                vcard:     { label: 'vCard Contact', placeholder: 'Name:John,Phone:+91...,Email:john@...' },
                event:     { label: 'Event Details', placeholder: 'Title:My Event,Start:2024-12-25 18:00,End:2024-12-25 21:00,Location:Hall A' },
                instagram: { label: 'Instagram Profile', placeholder: 'https://instagram.com/username' },
                twitter:   { label: 'Twitter/X Profile', placeholder: 'https://twitter.com/username' },
                facebook:  { label: 'Facebook Page', placeholder: 'https://facebook.com/page' },
                linkedin:  { label: 'LinkedIn Profile', placeholder: 'https://linkedin.com/in/username' },
                tiktok:    { label: 'TikTok Profile', placeholder: 'https://tiktok.com/@username' },
                youtube:   { label: 'YouTube Channel', placeholder: 'https://youtube.com/@channel' },
                whatsapp:  { label: 'WhatsApp Chat', placeholder: 'https://wa.me/911234567890' },
                multiurl:  { label: 'Multi URL (comma-separated)', placeholder: 'https://site1.com,https://site2.com' },
                appstore:  { label: 'App Store Link', placeholder: 'https://apps.apple.com/app/id123456' },
                googleplay:{ label: 'Google Play Link', placeholder: 'https://play.google.com/store/apps/details?id=com.app' },
                pdf:       { label: 'PDF URL', placeholder: 'https://example.com/document.pdf' },
                menu:      { label: 'Menu URL', placeholder: 'https://example.com/menu.pdf' },
                review:    { label: 'Review Request URL', placeholder: 'https://example.com/review' }
            };

            // ─── Update fields ───
            function updateFields() {
                const type = dataType.value;
                const cfg = typeConfigs[type];
                if (cfg) {
                    inputLabel.textContent = cfg.label;
                    dataInput.placeholder = cfg.placeholder;
                } else {
                    inputLabel.textContent = 'Enter Data';
                    dataInput.placeholder = 'Enter the required data';
                }
                dataInput.value = '';
                resetDisplay();
                resetFileUpload();

                const fileTypes = ['pdf', 'menu'];
                if (fileTypes.includes(type)) {
                    fileUploadRow.classList.add('visible');
                    uploadBtnText.textContent = type === 'pdf' ? 'Upload PDF' : 'Upload Image';
                    fileInput.accept = type === 'pdf' ? '.pdf' : '.jpg,.jpeg,.png,.webp';
                } else {
                    fileUploadRow.classList.remove('visible');
                }
            }

            function resetFileUpload() {
                fileInput.value = '';
                uploadedFileBase64 = null;
                fileInfo.classList.remove('visible');
                clearFileBtn.classList.remove('visible');
                sizeWarning.classList.remove('visible');
                compressInfo.classList.remove('visible');
                fileName.textContent = '';
                fileSize.textContent = '';
                filePreview.src = '';
            }

            // ─── Compress image ───
            function compressImage(file, maxSize = 200, quality = 0.6) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            let width = img.width;
                            let height = img.height;
                            let q = quality;
                            let canvas = document.createElement('canvas');
                            if (width > maxSize || height > maxSize) {
                                const ratio = Math.min(maxSize / width, maxSize / height);
                                width = Math.round(width * ratio);
                                height = Math.round(height * ratio);
                                compressInfo.classList.add('visible');
                            } else {
                                compressInfo.classList.remove('visible');
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            let dataUri = canvas.toDataURL('image/jpeg', q);
                            // If still too large, reduce quality further
                            if (dataUri.length > 3500) {
                                q = 0.4;
                                dataUri = canvas.toDataURL('image/jpeg', q);
                            }
                            if (dataUri.length > 4000) {
                                q = 0.2;
                                dataUri = canvas.toDataURL('image/jpeg', q);
                            }
                            if (dataUri.length > 4500) {
                                q = 0.1;
                                dataUri = canvas.toDataURL('image/jpeg', q);
                            }
                            resolve(dataUri);
                        };
                        img.onerror = reject;
                        img.src = e.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            // ─── Handle file upload ───
            async function handleFileUpload(file) {
                if (!file) return;
                const type = dataType.value;

                if (type === 'pdf') {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const dataUri = e.target.result;
                        const base64Len = dataUri.split(',')[1].length;
                        fileName.textContent = file.name;
                        fileSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
                        fileInfo.classList.add('visible');
                        clearFileBtn.classList.add('visible');
                        filePreview.src = '';

                        if (base64Len > 3000) {
                            sizeWarning.classList.add('visible');
                            showToast('PDF too large. Use a URL instead.', 'fa-exclamation-triangle', '#fbbf24');
                            uploadedFileBase64 = null;
                            return;
                        }
                        sizeWarning.classList.remove('visible');
                        uploadedFileBase64 = dataUri;
                        dataInput.value = dataUri;
                        showToast('PDF loaded! Generate QR to encode.', 'fa-check-circle', '#34d399');
                    };
                    reader.readAsDataURL(file);
                    return;
                }

                // Image (menu)
                try {
                    const compressed = await compressImage(file);
                    const base64Len = compressed.split(',')[1].length;
                    fileName.textContent = file.name;
                    fileSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
                    filePreview.src = compressed;
                    fileInfo.classList.add('visible');
                    clearFileBtn.classList.add('visible');
                    compressInfo.classList.add('visible');

                    if (base64Len > 3500) {
                        sizeWarning.classList.add('visible');
                        showToast('Image still too large. Try a smaller image or use a URL.', 'fa-exclamation-triangle', '#fbbf24');
                        uploadedFileBase64 = null;
                        return;
                    }
                    sizeWarning.classList.remove('visible');
                    uploadedFileBase64 = compressed;
                    dataInput.value = compressed;
                    showToast('Image compressed & ready!', 'fa-check-circle', '#34d399');
                } catch (err) {
                    showToast('Failed to process image.', 'fa-times-circle', '#f87171');
                }
            }

            // ─── Build QR data ───
            function buildQRData(type, raw) {
                const v = raw.trim();
                if (!v) return null;

                switch (type) {
                    case 'url':
                    case 'text':
                    case 'instagram':
                    case 'twitter':
                    case 'facebook':
                    case 'linkedin':
                    case 'tiktok':
                    case 'youtube':
                    case 'whatsapp':
                    case 'multiurl':
                    case 'appstore':
                    case 'googleplay':
                    case 'review':
                        return v;

                    case 'email':
                        return `mailto:${v}`;
                    case 'phone':
                        return `tel:${v}`;
                    case 'sms':
                        return `sms:${v}`;

                    case 'pdf':
                    case 'menu':
                        if (v.startsWith('data:application/pdf;base64,') ||
                            v.startsWith('data:image/') ||
                            v.startsWith('data:application/')) {
                            return v;
                        }
                        return v;

                    case 'wifi': {
                        const parts = v.split(',').map(p => p.trim());
                        let ssid = '', password = '', type2 = 'WPA';
                        for (const p of parts) {
                            const lower = p.toLowerCase();
                            if (lower.startsWith('ssid:')) ssid = p.substring(5);
                            else if (lower.startsWith('password:')) password = p.substring(9);
                            else if (lower.startsWith('type:')) type2 = p.substring(5);
                        }
                        if (!ssid) return null;
                        return `WIFI:T:${type2};S:${ssid};P:${password};;`;
                    }

                    case 'vcard': {
                        const parts = v.split(',').map(p => p.trim());
                        let name = '', phone = '', email = '';
                        for (const p of parts) {
                            const lower = p.toLowerCase();
                            if (lower.startsWith('name:')) name = p.substring(5);
                            else if (lower.startsWith('phone:')) phone = p.substring(6);
                            else if (lower.startsWith('email:')) email = p.substring(6);
                        }
                        if (!name) return null;
                        return `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nTEL:${phone}\nEMAIL:${email}\nEND:VCARD`;
                    }

                    case 'event': {
                        const parts = v.split(',').map(p => p.trim());
                        let title = '', start = '', end = '', location = '';
                        for (const p of parts) {
                            const lower = p.toLowerCase();
                            if (lower.startsWith('title:')) title = p.substring(6);
                            else if (lower.startsWith('start:')) start = p.substring(6);
                            else if (lower.startsWith('end:')) end = p.substring(4);
                            else if (lower.startsWith('location:')) location = p.substring(9);
                        }
                        if (!title || !start) return null;
                        return `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${start.replace(/[-: ]/g,'')}/${end ? end.replace(/[-: ]/g,'') : ''}&location=${encodeURIComponent(location)}`;
                    }

                    default:
                        return v;
                }
            }

            // ─── Generate QR (with error handling) ───
            function generateQR() {
                const type = dataType.value;
                const raw = dataInput.value;
                const data = buildQRData(type, raw);
                if (!data) {
                    showToast('Please fill in the required fields correctly.', 'fa-exclamation-circle', '#f87171');
                    return;
                }

                // Check data length
                if (data.length > 3000) {
                    showToast('Data too long for QR. Use a shorter text or URL.', 'fa-exclamation-circle', '#f87171');
                    return;
                }

                try {
                    qrContainer.innerHTML = '';
                    new QRCode(qrContainer, {
                        text: data,
                        width: 200,
                        height: 200,
                        colorDark: '#0b0e14',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });

                    placeholder.style.display = 'none';
                    qrBox.classList.add('visible');
                    qrActions.classList.add('visible');
                    qrPanel.classList.add('has-qr');
                    showToast('QR generated successfully!');
                } catch (err) {
                    showToast('QR generation failed: ' + err.message, 'fa-times-circle', '#f87171');
                }
            }

            function resetDisplay() {
                placeholder.style.display = 'block';
                qrBox.classList.remove('visible');
                qrActions.classList.remove('visible');
                qrPanel.classList.remove('has-qr');
                qrContainer.innerHTML = '';
            }

            function resetAll() {
                dataInput.value = '';
                resetDisplay();
                resetFileUpload();
                showToast('Reset complete.');
            }

            function downloadPNG() {
                const canvas = qrContainer.querySelector('canvas');
                if (!canvas) {
                    showToast('Generate a QR code first.', 'fa-exclamation-circle', '#f87171');
                    return;
                }
                const link = document.createElement('a');
                link.download = 'qrcode.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('PNG downloaded!');
            }

            // ─── Event listeners ───
            dataType.addEventListener('change', updateFields);
            updateFields();

            generateBtn.addEventListener('click', generateQR);
            downloadBtn.addEventListener('click', downloadPNG);
            resetBtn.addEventListener('click', resetAll);

            uploadBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    handleFileUpload(this.files[0]);
                }
            });
            clearFileBtn.addEventListener('click', resetFileUpload);

            dataInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    generateQR();
                }
            });

            resetDisplay();
            showToast('Welcome to QR Forge');
        })();
    </script>
</body>
</html>
